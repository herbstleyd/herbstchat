name: Herbstchat Clients bauen
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        working-directory: client
        run: python build.py
      - name: Selbsttest (Windows/Linux)
        if: runner.os != 'macOS'
        working-directory: client/dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0; fi
          ./Herbstchat* --selftest
      - name: Selbsttest (macOS)
        if: runner.os == 'macOS'
        working-directory: client/dist
        run: ./Herbstchat.app/Contents/MacOS/Herbstchat --selftest
      - name: macOS-App zippen
        if: runner.os == 'macOS'
        working-directory: client/dist
        run: ditto -c -k --keepParent Herbstchat.app Herbstchat-macOS.zip && rm -rf Herbstchat.app Herbstchat
      - uses: actions/upload-artifact@v4
        with:
          name: Herbstchat-${{ runner.os }}
          path: client/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Signaturschlüssel
        env: { KS: "${{ secrets.HC_KEYSTORE_B64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: APK bauen
        working-directory: android
        env: { HC_KEYSTORE_PASSWORD: "${{ secrets.HC_KEYSTORE_PASSWORD }}" }
        run: ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk Herbstchat-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Herbstchat-Android
          path: android/Herbstchat-1.0.0.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Dateien vorbereiten
        run: |
          mkdir rel
          cp art/Herbstchat-Android/*.apk rel/
          cp art/Herbstchat-Windows/Herbstchat.exe rel/Herbstchat-Windows.exe
          cp art/Herbstchat-macOS/Herbstchat-macOS.zip rel/
          cp art/Herbstchat-Linux/Herbstchat rel/Herbstchat-Linux-x86_64
          cp herbstchat-server_1.0.0_all.deb rel/
          (cd rel && sha256sum * > SHA256SUMS.txt)
          ls -la rel
      - name: Release anlegen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" rel/* --title "Herbstchat ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md \
            || gh release upload "$GITHUB_REF_NAME" rel/* --clobber
