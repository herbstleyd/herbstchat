name: Herbstchat Clients bauen
on: [push, workflow_dispatch]
jobs:
  # Server: Protokoll-Selbsttest + Debian-Paket. Bei Versions-Tag wird hier auch das Release angelegt,
  # damit die Client-Jobs ihre Dateien sofort anhängen können.
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Selbsttest
        run: pip install -q aiohttp pynacl && python server/test_server.py
      - name: Versionen prüfen
        shell: bash
        run: |
          s=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/herbstchat_server.py)
          c=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' client/herbstchat.py)
          a=$(sed -n 's/^const val VERSION = "\(.*\)"/\1/p' android/app/src/main/java/org/herbstleyd/herbstchat/Store.kt)
          g=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          echo "Server $s | Desktop $c | Android $a | Gradle $g"
          [ "$s" = "$c" ] && [ "$s" = "$a" ] && [ "$s" = "$g" ] || { echo "::error::Versionsnummern sind nicht einheitlich"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$s" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $s"; exit 1; fi
          echo "HC_VERSION=$s" >> "$GITHUB_ENV"
      - name: Debian-Paket bauen
        run: ./server/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Herbstchat-Server
          path: server/herbstchat-server_*_all.deb
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          sed "s/@VERSION@/$HC_VERSION/g" .github/release-notes.md > notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Herbstchat $HC_VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" server/herbstchat-server_*_all.deb --clobber

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        working-directory: client
        run: python build.py
      - name: Selbsttest (Windows/Linux)
        if: runner.os != 'macOS'
        working-directory: client/dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0; fi
          ./Herbstchat* --selftest
      - name: Selbsttest (macOS)
        if: runner.os == 'macOS'
        working-directory: client/dist
        run: ./Herbstchat.app/Contents/MacOS/Herbstchat --selftest
      - name: macOS-App zippen
        if: runner.os == 'macOS'
        working-directory: client/dist
        run: ditto -c -k --keepParent Herbstchat.app Herbstchat-macOS.zip && rm -rf Herbstchat.app Herbstchat
      - uses: actions/upload-artifact@v4
        with:
          name: Herbstchat-${{ runner.os }}
          path: client/dist/*
      - name: Ans Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: client/dist
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          case "$RUNNER_OS" in
            Windows) f=Herbstchat-Windows.exe; cp Herbstchat.exe "$f" ;;
            macOS)   f=Herbstchat-macOS.zip ;;
            Linux)   f=Herbstchat-Linux-x86_64; cp Herbstchat "$f" ;;
          esac
          # Release wird vom Job "server" angelegt (dauert ca. 1 Minute)
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" "$f" --clobber

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Signaturschlüssel
        env: { KS: "${{ secrets.HC_KEYSTORE_B64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "HC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; fi
      - name: APK bauen
        working-directory: android
        env: { HC_KEYSTORE_PASSWORD: "${{ secrets.HC_KEYSTORE_PASSWORD }}" }
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Herbstchat-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Herbstchat-Android
          path: android/Herbstchat-*.apk
      - name: Ans Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" Herbstchat-*.apk --clobber
